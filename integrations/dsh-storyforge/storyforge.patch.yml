# StoryForge 的 bundle 补丁：package.json 的 `dsh.bundle.patch` 指向本文件，装插件后 DSH 把
# 插件加进 profile 的 bundle 列表，每次启动自动叠加（不需要 `--patch`）。
#
# 1. 激活宿主插件（注册 provider `storyforge` 与 /api/storyforge/* 路由）。每轮写作交给
#    Rust sidecar（先 `cargo build -p storyforge-dsh-bridge`），模型调用用 StoryForge 首页
#    选的底层模型；可选配置（dataDir、cardsDir、debugEcho……）见 README。
# 2. 新增 agent 预设 `storyforge`：只有 persona，不挂任何工具；附带 agent 作用域插件
#    `dsh-plugin-storyforge/agent`，把该预设下每次模型请求钉到 storyforge/pipeline。
- insert:
    - id: storyforge
      name: 'dsh-plugin-storyforge'
    - id: preset-storyforge
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: storyforge
        name: StoryForge
        description: StoryForge 多 Agent 写作管线（PoC）
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are StoryForge, a multi-agent interactive fiction engine.
              complete: true
              includeRuntimeContext: false
          - id: storyforge-agent
            name: 'dsh-plugin-storyforge/agent'
