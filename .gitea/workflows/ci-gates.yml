# Gitea Actions: fast PR / push gates (Linux only).
#
# Runs formatting, strict Clippy, workspace tests, and frontend tests/build.
# These four jobs run on ubuntu-latest and always reach a terminal state on a
# normal push/PR.
#
# Windows-only gates (Pester release-helper suite, repository secret scan, and
# workflow YAML syntax validation) live in windows-gates.yml. They were moved
# out of this workflow because, on Gitea 1.26 + act_runner, a job-level `if`
# guard is not evaluated before runner assignment: with no Windows runner, a
# `runs-on: windows-latest` job stays at status=5 (blocked) forever, so the
# whole ci-gates run never finishes and cannot be re-run. windows-gates.yml is
# triggered only by manual workflow_dispatch or a v* tag, so an absent Windows
# runner produces no blocked job here.
#
# This workflow does NOT build host artifacts, APKs, or installers. It does NOT
# run the Windows-only Pester/secret-scan/workflow-syntax gates; run
# windows-gates.yml (or the local scripts/verify-release.ps1) for those.
name: ci-gates

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
  # Allow controlled manual re-runs without manufacturing a business commit.
  workflow_dispatch:

# Cancel superseded runs on the same ref so stale pushes do not pile up.
concurrency:
  group: ci-gates-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: only read the repo contents. No deploy/packages/admin.
permissions:
  contents: read

jobs:
  rust-fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # dtolnay/rust-toolchain 在 gitea.com 无镜像且 github.com 从国内 runner
      # 不可达；改为幂等 rustup 安装（rsproxy 镜像 + runner 持久卷缓存）。
      - name: Install Rust toolchain (mirror-friendly, idempotent)
        run: |
          export RUSTUP_DIST_SERVER=https://rsproxy.cn
          export RUSTUP_UPDATE_ROOT=https://rsproxy.cn/rustup
          if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://rsproxy.cn/rustup-init.sh \
              | sh -s -- -y --default-toolchain stable --profile minimal
          fi
          "$HOME/.cargo/bin/rustup" component add rustfmt clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_DIST_SERVER=https://rsproxy.cn" >> "$GITHUB_ENV"
          echo "RUSTUP_UPDATE_ROOT=https://rsproxy.cn/rustup" >> "$GITHUB_ENV"
      - name: cargo fmt --check
        run: cargo fmt --all --check

  rust-clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux Tauri / WebKit system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Install Rust toolchain (mirror-friendly, idempotent)
        run: |
          export RUSTUP_DIST_SERVER=https://rsproxy.cn
          export RUSTUP_UPDATE_ROOT=https://rsproxy.cn/rustup
          if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://rsproxy.cn/rustup-init.sh \
              | sh -s -- -y --default-toolchain stable --profile minimal
          fi
          "$HOME/.cargo/bin/rustup" component add rustfmt clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_DIST_SERVER=https://rsproxy.cn" >> "$GITHUB_ENV"
          echo "RUSTUP_UPDATE_ROOT=https://rsproxy.cn/rustup" >> "$GITHUB_ENV"
      - name: Setup Node (frontendDist for Tauri generate_context!)
        # actions/setup-node 无本地镜像（gitea.com 迁移远端故障）；nodejs.org
        # 从 runner 容器可达，直下 tar 到持久 toolcache 卷（第二次 job 秒过）。
        # node 22 LTS：`node --test` 的 glob 参数 v22+ 才支持（v20 当字面路径）。
        run: |
          set -euo pipefail
          NODE_VERSION=22.12.0
          NODE_DIR=/opt/hostedtoolcache/storyforge-node22
          if [ ! -x "$NODE_DIR/bin/node" ]; then
            ARCHIVE="node-v${NODE_VERSION}-linux-x64.tar.xz"
            curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/${ARCHIVE}" -o "/tmp/${ARCHIVE}"
            curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt" -o /tmp/node-SHASUMS256.txt
            (cd /tmp && grep "  ${ARCHIVE}$" node-SHASUMS256.txt | sha256sum -c -)
            mkdir -p "$NODE_DIR"
            tar -xJf "/tmp/${ARCHIVE}" -C "$NODE_DIR" --strip-components=1
          fi
          echo "$NODE_DIR/bin" >> "$GITHUB_PATH"
          "$NODE_DIR/bin/node" --version
      - name: Build frontend dist for Tauri context
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Linux Tauri / WebKit system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Install Rust toolchain (mirror-friendly, idempotent)
        run: |
          export RUSTUP_DIST_SERVER=https://rsproxy.cn
          export RUSTUP_UPDATE_ROOT=https://rsproxy.cn/rustup
          if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://rsproxy.cn/rustup-init.sh \
              | sh -s -- -y --default-toolchain stable --profile minimal
          fi
          "$HOME/.cargo/bin/rustup" component add rustfmt clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_DIST_SERVER=https://rsproxy.cn" >> "$GITHUB_ENV"
          echo "RUSTUP_UPDATE_ROOT=https://rsproxy.cn/rustup" >> "$GITHUB_ENV"
      - name: Setup Node (frontendDist for Tauri generate_context!)
        # actions/setup-node 无本地镜像（gitea.com 迁移远端故障）；nodejs.org
        # 从 runner 容器可达，直下 tar 到持久 toolcache 卷（第二次 job 秒过）。
        # node 22 LTS：`node --test` 的 glob 参数 v22+ 才支持（v20 当字面路径）。
        run: |
          set -euo pipefail
          NODE_VERSION=22.12.0
          NODE_DIR=/opt/hostedtoolcache/storyforge-node22
          if [ ! -x "$NODE_DIR/bin/node" ]; then
            ARCHIVE="node-v${NODE_VERSION}-linux-x64.tar.xz"
            curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/${ARCHIVE}" -o "/tmp/${ARCHIVE}"
            curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt" -o /tmp/node-SHASUMS256.txt
            (cd /tmp && grep "  ${ARCHIVE}$" node-SHASUMS256.txt | sha256sum -c -)
            mkdir -p "$NODE_DIR"
            tar -xJf "/tmp/${ARCHIVE}" -C "$NODE_DIR" --strip-components=1
          fi
          echo "$NODE_DIR/bin" >> "$GITHUB_PATH"
          "$NODE_DIR/bin/node" --version
      - name: Build frontend dist for Tauri context
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: cargo test --workspace
        run: cargo test --workspace

  frontend-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        # actions/setup-node 无本地镜像（gitea.com 迁移远端故障）；nodejs.org
        # 从 runner 容器可达，直下 tar 到持久 toolcache 卷（第二次 job 秒过）。
        # node 22 LTS：`node --test` 的 glob 参数 v22+ 才支持（v20 当字面路径）。
        run: |
          set -euo pipefail
          NODE_VERSION=22.12.0
          NODE_DIR=/opt/hostedtoolcache/storyforge-node22
          if [ ! -x "$NODE_DIR/bin/node" ]; then
            ARCHIVE="node-v${NODE_VERSION}-linux-x64.tar.xz"
            curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/${ARCHIVE}" -o "/tmp/${ARCHIVE}"
            curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/SHASUMS256.txt" -o /tmp/node-SHASUMS256.txt
            (cd /tmp && grep "  ${ARCHIVE}$" node-SHASUMS256.txt | sha256sum -c -)
            mkdir -p "$NODE_DIR"
            tar -xJf "/tmp/${ARCHIVE}" -C "$NODE_DIR" --strip-components=1
          fi
          echo "$NODE_DIR/bin" >> "$GITHUB_PATH"
          "$NODE_DIR/bin/node" --version
      # Strict npm ci: fail closed if package-lock is out of sync.
      - name: npm ci
        run: npm ci
      - name: npm test
        run: npm test
      - name: npm run build
        run: npm run build
