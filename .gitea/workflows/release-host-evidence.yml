# Gitea Actions: manual / tagged host artifact evidence.
#
# Produces Windows host build evidence and Android host smoke evidence by
# invoking the production PowerShell helpers. Uploads subjects, hash sidecars,
# manifests, provenance, and SBOM-style inventories with bounded retention.
#
# This workflow does NOT sign, publish, deploy, install to a device, or run GUI
# acceptance. It may only claim host evidence and (when produced) an unsigned APK.
#
# 2026-08-05 Gate 8 审查 P2-F2：本 workflow 引用 GitHub 官方 actions
# （dtolnay/rust-toolchain、actions/setup-node、actions/upload-artifact），
# 与 ci-gates.yml 的「github.com 不可达、需手写安装」约束不同——仅在 Gitea
# 实例配置了 actions 镜像时才可 dispatch；未配置镜像时本 workflow 不可用，
# 发布证据以本机手工 run-android-smoke/run-release-build 为准。
name: release-host-evidence

on:
  workflow_dispatch:
    inputs:
      skip_bundle:
        description: 'Skip Tauri bundle (host-binary-only evidence). Default true for reliable host evidence; set false only after tauri-cli is installed.'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
  push:
    tags: ['v*']

# Cancel superseded evidence runs on the same ref.
concurrency:
  group: release-host-evidence-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: read repo to checkout. Artifacts are uploaded via the
# implicit actions token; no packages/deploy/admin/oidc scopes needed.
permissions:
  contents: read

jobs:
  windows-host-evidence:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Prevent the workflow from accidentally inheriting a workstation target dir.
      CARGO_TARGET_DIR: ''
      RUST_LOG: 'info'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install pinned tauri-cli when bundle is requested
        # Only an explicit manual `false` requests a bundle. Tags and missing
        # input stay host-only; malformed input is rejected by the producer
        # before it can run a build, so a fresh runner never implicitly depends
        # on cargo-tauri.
        if: github.event.inputs.skip_bundle == 'false'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pinned = '2.11.2'
          cargo install tauri-cli --locked --version $pinned --force
          cargo tauri --version
          $ver = (& cargo tauri --version 2>&1 | Out-String).Trim()
          if ($ver -notmatch [regex]::Escape($pinned)) {
            throw "Expected tauri-cli $pinned, got: $ver"
          }

      - name: Windows host release build
        id: evidence
        shell: pwsh
        # Keep dispatch input as data. Do not interpolate it directly into a
        # PowerShell string: malformed API input must fail closed, not become
        # executable source text.
        env:
          SF_RELEASE_SKIP_BUNDLE_INPUT: ${{ github.event.inputs.skip_bundle }}
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceDir = Join-Path $PWD ("artifacts\release-build\windows-gitea-" + [guid]::NewGuid().ToString('N'))
          $skipBundleInput = [string]$env:SF_RELEASE_SKIP_BUNDLE_INPUT
          if ($skipBundleInput -notin @('', 'true', 'false')) {
            throw 'skip_bundle must be empty, true, or false.'
          }
          if (Test-Path -LiteralPath $evidenceDir) {
            throw 'Refusing to reuse an existing Windows evidence directory.'
          }
          # An explicit false is the sole opt-in to a bundle. Empty tag input
          # and the workflow_dispatch default true take the else (host-only)
          # branch; every other supplied value was rejected above.
          if ($skipBundleInput -eq 'false') {
            pwsh -NoProfile -File scripts/run-release-build.ps1 -OutputDir $evidenceDir
          } else {
            pwsh -NoProfile -File scripts/run-release-build.ps1 -SkipBundle -OutputDir $evidenceDir
          }
          if ($LASTEXITCODE -ne 0) {
            throw "Windows release build failed with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path -LiteralPath (Join-Path $evidenceDir 'manifest.json') -PathType Leaf)) {
            throw 'Windows build did not produce manifest.json in its controlled evidence directory.'
          }
          "dir=$evidenceDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Offline verify Windows evidence package (fail-closed)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . .\scripts\release-build\ReleaseBuild.Common.ps1
          $evidenceDir = '${{ steps.evidence.outputs.dir }}'
          # Full offline verifier: staged↔provenance exact-set, artifact→staged
          # reverse mapping, sidecar grammar, reparse rejection, recursive secret scan.
          $result = Assert-ReleaseEvidencePackage -EvidenceDir $evidenceDir

      - name: Upload Windows evidence (subjects + sidecars + manifest + provenance)
        uses: actions/upload-artifact@v4
        with:
          name: windows-host-evidence-${{ github.sha }}
          path: ${{ steps.evidence.outputs.dir }}
          retention-days: 14

  android-host-evidence:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ''
      RUST_LOG: 'info'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Ensure aarch64-linux-android target
        shell: pwsh
        run: |
          rustup target add aarch64-linux-android
          rustup target list --installed | Select-String 'aarch64-linux-android'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Android host smoke: frontend build, capabilities tests, and aarch64
      # Rust check. SDK/NDK are NOT installed here, so -BuildApk is intentionally
      # omitted: requesting APK evidence without prerequisites fails closed.
      - name: Android host pipeline (host smoke, no device, no APK)
        id: evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $evidenceDir = Join-Path $PWD ("artifacts\release-build\android-gitea-" + [guid]::NewGuid().ToString('N'))
          if (Test-Path -LiteralPath $evidenceDir) {
            throw 'Refusing to reuse an existing Android evidence directory.'
          }
          pwsh -NoProfile -File scripts/run-android-host-pipeline.ps1 -OutputDir $evidenceDir
          if ($LASTEXITCODE -ne 0) {
            throw "Android host pipeline failed with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path -LiteralPath (Join-Path $evidenceDir 'manifest.json') -PathType Leaf)) {
            throw 'Android host pipeline did not produce manifest.json in its controlled evidence directory.'
          }
          "dir=$evidenceDir" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Offline verify Android evidence package (fail-closed)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . .\scripts\release-build\ReleaseBuild.Common.ps1
          $evidenceDir = '${{ steps.evidence.outputs.dir }}'
          # Full offline verifier for Android host evidence before upload.
          $result = Assert-ReleaseEvidencePackage -EvidenceDir $evidenceDir

      - name: Upload Android evidence
        uses: actions/upload-artifact@v4
        with:
          name: android-host-evidence-${{ github.sha }}
          path: ${{ steps.evidence.outputs.dir }}
          retention-days: 14
