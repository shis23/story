# Gitea Actions: manual / tagged host artifact evidence.
#
# Produces Windows host build evidence and Android host smoke evidence by
# invoking the production PowerShell helpers. Uploads subjects, hash sidecars,
# manifests, provenance, and SBOM-style inventories with bounded retention.
#
# This workflow does NOT sign, publish, deploy, install to a device, or run GUI
# acceptance. It may only claim host evidence and (when produced) an unsigned APK.
name: release-host-evidence

on:
  workflow_dispatch:
    inputs:
      skip_bundle:
        description: 'Skip Tauri bundle (host-binary-only evidence). Default true for reliable host evidence; set false only after tauri-cli is installed.'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
  push:
    tags: ['v*']

# Cancel superseded evidence runs on the same ref.
concurrency:
  group: release-host-evidence-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: read repo to checkout. Artifacts are uploaded via the
# implicit actions token; no packages/deploy/admin/oidc scopes needed.
permissions:
  contents: read

jobs:
  windows-host-evidence:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Prevent the workflow from accidentally inheriting a workstation target dir.
      CARGO_TARGET_DIR: ''
      RUST_LOG: 'info'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Default path is host-only (-SkipBundle). Tags and empty inputs also
      # default to host-only so a fresh runner never fails for missing tauri-cli.
      # When skip_bundle is explicitly false, install a pinned cargo-tauri.
      - name: Resolve skip-bundle flag
        id: bundle
        shell: pwsh
        run: |
          $skip = '${{ github.event.inputs.skip_bundle }}'
          # workflow_dispatch default is true; tags / empty => host-only.
          if ([string]::IsNullOrWhiteSpace($skip) -or $skip -eq 'true') {
            "skip_bundle=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "skip_bundle=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Install pinned tauri-cli when bundle is requested
        if: steps.bundle.outputs.skip_bundle == 'false'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pinned = '2.11.2'
          cargo install tauri-cli --locked --version $pinned --force
          cargo tauri --version
          $ver = (& cargo tauri --version 2>&1 | Out-String).Trim()
          if ($ver -notmatch [regex]::Escape($pinned)) {
            throw "Expected tauri-cli $pinned, got: $ver"
          }

      - name: Windows host release build
        shell: pwsh
        run: |
          if ('${{ steps.bundle.outputs.skip_bundle }}' -eq 'true') {
            pwsh -NoProfile -File scripts/run-release-build.ps1 -SkipBundle
          } else {
            pwsh -NoProfile -File scripts/run-release-build.ps1
          }

      - name: Locate evidence directory
        id: evidence
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'artifacts\release-build'
          $latest = Get-ChildItem -LiteralPath $root -Directory |
            Where-Object { $_.Name -like 'windows-*' } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $latest) {
            throw 'No windows-* evidence directory found.'
          }
          "dir=$($latest.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Evidence dir: $($latest.FullName)"

      - name: Offline verify Windows evidence package (fail-closed)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . .\scripts\release-build\ReleaseBuild.Common.ps1
          $evidenceDir = '${{ steps.evidence.outputs.dir }}'
          # Full offline verifier: staged↔provenance exact-set, artifact→staged
          # reverse mapping, sidecar grammar, reparse rejection, recursive secret scan.
          $result = Assert-ReleaseEvidencePackage -EvidenceDir $evidenceDir
          Write-Host ("Full offline verification passed; subjects={0} build_status={1}" -f $result.subject_count, $result.build_status)

      - name: Upload Windows evidence (subjects + sidecars + manifest + provenance)
        uses: actions/upload-artifact@v4
        with:
          name: windows-host-evidence-${{ github.sha }}
          path: ${{ steps.evidence.outputs.dir }}
          retention-days: 14

  android-host-evidence:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: ''
      RUST_LOG: 'info'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Ensure aarch64-linux-android target
        shell: pwsh
        run: |
          rustup target add aarch64-linux-android
          rustup target list --installed | Select-String 'aarch64-linux-android'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Android host smoke: frontend build, capabilities tests, and aarch64
      # Rust check. SDK/NDK are NOT installed here, so -BuildApk is intentionally
      # omitted: requesting APK evidence without prerequisites fails closed.
      - name: Android host pipeline (host smoke, no device, no APK)
        shell: pwsh
        run: |
          pwsh -NoProfile -File scripts/run-android-host-pipeline.ps1

      - name: Locate Android evidence directory
        id: evidence
        shell: pwsh
        run: |
          $root = Join-Path $PWD 'artifacts\release-build'
          $latest = Get-ChildItem -LiteralPath $root -Directory |
            Where-Object { $_.Name -like 'android-*' } |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if (-not $latest) {
            throw 'No android-* evidence directory found.'
          }
          "dir=$($latest.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Offline verify Android evidence package (fail-closed)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          . .\scripts\release-build\ReleaseBuild.Common.ps1
          $evidenceDir = '${{ steps.evidence.outputs.dir }}'
          # Full offline verifier for Android host evidence before upload.
          $result = Assert-ReleaseEvidencePackage -EvidenceDir $evidenceDir
          Write-Host ("Full offline verification passed; subjects={0} build_status={1}" -f $result.subject_count, $result.build_status)

      - name: Upload Android evidence
        uses: actions/upload-artifact@v4
        with:
          name: android-host-evidence-${{ github.sha }}
          path: ${{ steps.evidence.outputs.dir }}
          retention-days: 14
