[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/infra-util",
    "crates/infra-import",
    "crates/infra-llm",
    "crates/infra-vector",
    "crates/infra-regex",
    "crates/infra-plugin-host",
    "crates/infra-sqlite",
    "crates/app-logging",
    "crates/app-agent",
    "crates/app-conversation",
    "crates/app-pipeline",
    "crates/app-memory",
    "crates/app-meta",
    "crates/tauri-app",
    "crates/harness-real-llm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 时间
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }

# UUID
uuid = { version = "1", default-features = false, features = ["serde", "std", "v4"] }

# 错误处理
thiserror = "2"

# 正则（纯 Rust，移动端友好）
regress = "0.11"

# PNG 解析
crc32fast = "1"

# 哈希（P0-3：draft_hash 用 SHA-256 替代 DefaultHasher，保证跨进程稳定）
sha2 = "0.10"

# 领域模型
storyforge-domain = { path = "crates/domain" }
storyforge-infra-util = { path = "crates/infra-util" }
storyforge-infra-import = { path = "crates/infra-import" }
storyforge-infra-llm = { path = "crates/infra-llm" }

# LLM 客户端
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures = "0.3"
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
keyring = { version = "4.1.3", features = ["android-native-keyring-store"] }

# 向量库
# (L-19: hnsw_rs = "0.3" 已移除——workspace 声明但无任何 crate 引用，Cargo.lock 里
# 也无 hnsw。向量库实际用 BruteForceStore（infra-vector）。)

# infra 层
storyforge-infra-regex = { path = "crates/infra-regex" }
storyforge-infra-plugin-host = { path = "crates/infra-plugin-host" }
storyforge-infra-sqlite = { path = "crates/infra-sqlite" }
storyforge-app-meta = { path = "crates/app-meta" }

# app 层
storyforge-app-logging = { path = "crates/app-logging" }
storyforge-app-agent = { path = "crates/app-agent" }
storyforge-app-conversation = { path = "crates/app-conversation" }
storyforge-app-pipeline = { path = "crates/app-pipeline" }
storyforge-infra-vector = { path = "crates/infra-vector" }
storyforge-app-memory = { path = "crates/app-memory" }

# L-20：显式 release profile。默认 profile 不 strip 符号、不做 LTO，发布产物偏大且
# 含调试符号。开启 thin LTO + strip，减小体积并轻微提升运行时性能；codegen-unents=1
# 关闭多代码单元以最大化内联（编译变慢，但这是 release 一次性代价）。
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
