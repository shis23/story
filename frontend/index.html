<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f3ec" />
    <title>StoryForge</title>
    <script>
      (function () {
        try {
          // 默认浅色「纸上编辑部」；用户切换后记 localStorage（夜读深色为 'dark'）
          var t = localStorage.getItem('storyforge-theme') || 'light';
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1b1712');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
