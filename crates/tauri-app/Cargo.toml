[package]
name = "storyforge"
publish = false
version.workspace = true
edition.workspace = true

[lib]
name = "storyforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
storyforge-domain.workspace = true
storyforge-infra-util.workspace = true
storyforge-infra-import.workspace = true
storyforge-infra-llm.workspace = true
storyforge-infra-sqlite.workspace = true
storyforge-app-logging.workspace = true
storyforge-app-agent.workspace = true
storyforge-app-conversation.workspace = true
storyforge-app-pipeline.workspace = true
storyforge-app-meta.workspace = true
storyforge-infra-vector.workspace = true
storyforge-infra-plugin-host.workspace = true
storyforge-app-service.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
tokio.workspace = true
tracing.workspace = true
async-trait.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
sha2.workspace = true
reqwest = { workspace = true, features = ["blocking"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(target_os = "android")'.dependencies]
# Initialize ndk-context so android-native-keyring-store can access the Android
# Keystore. Without this, Store::new() panics on "android context was not
# initialized". Versions pinned to match the existing dependency graph.
ndk-context = "0.1"
jni = "0.21"

[dev-dependencies]
tempfile = "3"
# SQLite 集成测试直接核对落盘行（tests/sqlite_*_lifecycle.rs）；生产侧的
# SQLite 仓储已随应用服务层移到 storyforge-app-service。
rusqlite = "0.32"
storyforge-app-memory.workspace = true
storyforge-app-service = { workspace = true, features = ["test-support"] }
